# Keeps the free Render server awake: it sleeps after 15 minutes without visits and then
# takes up to a minute to start. One service running all month fits in Render's 750 free hours.
name: Mantener el servidor despierto
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://pintamundo.onrender.com/health
