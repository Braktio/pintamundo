# Publishes the game on GitHub Pages every time main is updated.
# Only the files the browser needs are uploaded; tests run first.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias del servidor
        run: npm ci
      - name: Pruebas
        run: node --test tests/*.test.js
      - name: Preparar solo los archivos del juego
        run: mkdir _site && cp -r index.html styles.css game.js engine.js renderer.js online.js cloud.js music.js manifest.webmanifest favicon.ico fonts icons ui _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
