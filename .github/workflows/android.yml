# Builds the signed Android APK on every push to main and publishes it on a fixed
# release ("apk"), so the latest version is always at the same download link.
name: Construir APK de Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Without the web client (type 3) the app builds, but Google sign-in fails on the phone.
      - name: Comprobar la configuración de Firebase
        run: |
          grep -q '"client_type": 3' android/app/google-services.json || { echo "google-services.json no tiene el cliente de Google: descárgalo de nuevo desde Firebase."; exit 1; }
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar el juego dentro del proyecto Android
        run: npm run android:sync
      - name: Recuperar la clave de firma
        run: echo "${{ secrets.PINTAMUNDO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/pintamundo.keystore"
      - name: Construir APK firmada
        working-directory: android
        env:
          PINTAMUNDO_KEYSTORE: ${{ runner.temp }}/pintamundo.keystore
          PINTAMUNDO_KEYSTORE_PASSWORD: ${{ secrets.PINTAMUNDO_KEYSTORE_PASSWORD }}
          PINTAMUNDO_KEY_ALIAS: pintamundo
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Copiar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pintamundo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pintamundo-apk
          path: pintamundo.apk
      - name: Publicar en la versión fija «apk»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --prerelease --title "Pintamundo para Android" --notes "Última APK construida automáticamente desde main. Descárgala desde el móvil e instálala."
          gh release upload apk pintamundo.apk --clobber
          gh release edit apk --notes "Última APK construida automáticamente desde main (versión 1.0.${{ github.run_number }}). Descárgala desde el móvil e instálala."
